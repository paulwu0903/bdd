asyncapi: {{asyncapi version}}
info:
  title: {{api title}}
  version: {{api version}}
  description: |
    `後端端點` 的即時事件契約，屬於 Truth：描述系統「現在」的完整即時事件，全專案只有這一份（`specs/truth/contracts/asyncapi.yaml`）。
    由 api-plan 依各 plan 的 plan.md 系統介面盤點，直接在本檔新增、修改或刪除；每次異動逐項記在該 plan 的 `truth-delta.md`，本檔不寫沿革。HTTP API 見同目錄的 openapi.yaml。
    本文件以伺服器的角度描述：`send` 表示伺服器推播給前端，`receive` 表示伺服器接收前端送來的訊息。

    **編號**：需求與決策編號一律帶 plan 前綴。`{{plan number}}/FR-001` 指 `specs/plans/{{plan directory name}}/spec.md` 的 FR-001，`research {{plan number}}/R1` 指同一個 plan 的 research.md 的 R1。
  tags:
    - name: {{backend interface name}}
      description: {{main interface}}

servers:
  {{server name}}:
    host: {{server host}}
    pathname: {{server pathname}}
    protocol: {{server protocol}}
    description: {{server description}}
    security:
      - $ref: '#/components/securitySchemes/{{security scheme name}}'

channels:
  {{channel name}}:
    address: {{channel address}}
    title: {{channel title}}
    description: |
      {{channel behavior}}
    messages:
      {{message name}}:
        $ref: '#/components/messages/{{message name}}'

operations:
  {{operation id}}:
    action: {{send or receive}}
    channel:
      $ref: '#/channels/{{channel name}}'
    messages:
      - $ref: '#/channels/{{channel name}}/messages/{{message name}}'
    summary: {{operation summary}}
    description: |
      **業務規則**
      - {{business rule}}

      **對應需求**：{{requirement ids}}
    tags:
      - name: {{backend interface name}}

components:
  securitySchemes:
    {{security scheme name}}:
      type: {{security type}}
      in: {{security location}}
      name: {{security key name}}
      description: {{security description}}

  messages:
    {{message name}}:
      name: {{message name}}
      title: {{message title}}
      contentType: application/json
      payload:
        type: object
        required: [{{required properties}}]
        properties:
          type:
            type: string
            const: {{message name}}
          {{property name}}:
            {{property schema}}
